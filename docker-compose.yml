# ---------------------------------------------------------------------------
# gng — full stack
#
#   docker compose up -d
#   docker compose exec api npm run db:migrate
#   docker compose exec api npm run db:seed      # creates the first admin
#
# Runs Postgres, the API and the storefront. Suitable as-is for a single-VPS
# deployment behind a reverse proxy that terminates TLS; see docs/LAUNCH.md.
#
# Secrets come from a `.env` file beside this one — never inline them here, since
# this file belongs in git and that one does not.
# ---------------------------------------------------------------------------

name: gng

services:
  postgres:
    # Pinned to a major.minor. A surprise major upgrade will not start against an
    # existing data directory, and finding that out during a deploy is no fun.
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gng}
      # Deterministic collation, so index ordering does not shift with a locale
      # change in the base image.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No published port by default: the database is reachable on the compose
    # network and nothing else. Uncomment only to attach a client from the host,
    # and bind to loopback when you do.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      # `pg_isready` alone returns true while the init scripts are still running,
      # so the database name is included to confirm it is actually serving.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gng} -d ${POSTGRES_DB:-gng}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Sized for an 8GB host. See the memory note at the foot of this file.
    #
    # Postgres is given the largest share and is the service that must never be
    # the one killed: the API and the storefront recover from a restart in
    # seconds, while a database killed mid-write comes back through crash
    # recovery. Giving every OTHER service a ceiling is what keeps the host out
    # of the memory pressure that would make the kernel pick a victim at all.
    mem_limit: 2g
    mem_reservation: 512m

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        # Not merely "started": the API validates its config and connects at
        # boot, so starting it against a database still initialising is a
        # guaranteed crash loop.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000

      # Node sizes its heap from the HOST's memory, not the container's limit —
      # so under `mem_limit` it will happily grow past the ceiling and be killed
      # rather than collect garbage. Set below the limit, leaving room for what
      # lives outside the JS heap: sharp decodes images in native memory, and a
      # 2000×2000 decode is tens of megabytes that the heap setting cannot see.
      NODE_OPTIONS: --max-old-space-size=1024

      API_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL in .env}
      CORS_ORIGINS: ${SITE_URL:?set SITE_URL in .env}
      # The storefront and the reverse proxy both sit in front of this service.
      # Must be > 0 in production or rate limiting sees one IP for every visitor.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Only when the API's port is published straight to the internet — see
      # .env.deploy.example.
      NO_REVERSE_PROXY: ${NO_REVERSE_PROXY:-false}

      # Tunable without editing the compose file. Static `/uploads` is exempt
      # from this limit in the API, so it is a budget for real API calls.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: "false"

      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-gng}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gng}
      DATABASE_SSL: "false"

      # How many database connections this API may hold at once.
      #
      # The code's own default is 10, chosen to be safe on any machine. That is
      # the number of checkouts that can be COMMITTING simultaneously — each one
      # holds its connection for the whole transaction, and every server-rendered
      # page borrows one too. On a shop running ads, ten is reached in a burst
      # and the eleventh request does not fail, it WAITS, which reads as "the
      # site got slow" rather than as a limit anyone would think to look at.
      #
      # Twenty is comfortable on this host: Postgres allows a hundred by
      # default, and a connection costs a few megabytes.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Only for bringing the shop up on a bare IP — see .env.deploy.example.
      ALLOW_INSECURE_COOKIES: ${ALLOW_INSECURE_COOKIES:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads

      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Admin}
    volumes:
      # Product photos live on disk with STORAGE_DRIVER=local. Without this
      # volume every image vanishes on the next deploy.
      - uploads:/app/uploads
    ports:
      # Loopback only. The reverse proxy needs to reach `/uploads/*` to serve
      # product photos to customers; everything else on the API is reached
      # server-to-server over the compose network and is never exposed.
      - "127.0.0.1:4000:4000"
    # Image processing is the memory-hungry part: several uploads at once each
    # decode to raw pixels before being re-encoded. `optimizeImages` runs them
    # one at a time for exactly this reason, so the ceiling is comfortable.
    mem_limit: 1500m
    mem_reservation: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      args:
        # Build-time values. `NEXT_PUBLIC_*` is inlined into the client bundle,
        # and API_URL is read by next.config.ts for the image allowlist — so
        # changing either requires a rebuild, not just a restart.
        API_URL: http://api:4000
        IMAGE_HOST: ${API_PUBLIC_URL}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_HOTLINE: ${NEXT_PUBLIC_HOTLINE:-}
        # Must differ on every deploy, so build through the script that
        # guarantees it rather than by hand:
        #
        #   bash deploy/redeploy.sh
        #
        # Reuse a value and a browser still holding the previous build carries
        # on calling server actions this build no longer has. It shows up as a
        # sign-in page with no "Forgot your password?" link — that bundle was
        # built before the link existed — and a password that will not go
        # through, both from the same stale JavaScript.
        #
        # Note what this cannot reach: a bundle built before `deploymentId` was
        # configured at all sends no id, so there is nothing to compare and no
        # hard navigation to trigger. Those tabs are only fixed by a reload,
        # which is what src/app/(admin)/admin/login/error.tsx is for.
        #
        # The `dev` fallback keeps a bare `docker compose build` working for
        # local use. A DEPLOY that reuses it is one no client can tell apart
        # from the last, which is exactly the bug.
        NEXT_DEPLOYMENT_ID: ${DEPLOYMENT_ID:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Same reason as the API: Node reads the host's memory, not the container
      # ceiling. Lower than the limit because next/image re-encodes photos
      # through sharp, in native memory the heap setting does not govern.
      NODE_OPTIONS: --max-old-space-size=1024
      # Server-side calls take the internal address; the browser never uses it.
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      # The panel's own session cookies. Needed alongside the API's flag while
      # the shop runs on a bare IP — see .env.deploy.example.
      ALLOW_INSECURE_COOKIES: ${ALLOW_INSECURE_COOKIES:-false}
      # Meta tracking is deliberately absent: the pixel id and Conversions API
      # token live in the database and are set from /admin/marketing, so changing
      # them needs neither a rebuild nor a restart.
    volumes:
      # Optimised product photos, and the ONLY expensive thing this container
      # produces. Next re-encodes every image at each breakpoint on first
      # request; without this volume that cache lives inside the container and
      # is destroyed by the next deploy, so every release is followed by a burst
      # of re-encoding across the whole catalogue — precisely when a shop is
      # most likely to be sending traffic at it. On a small VPS that burst is
      # what saturates the CPU, and the symptom is a slow shop rather than
      # anything that names images.
      #
      # Only `cache` is mounted, never `.next` itself: the rest of that
      # directory is build output that MUST come from the image, and a stale
      # volume over it would serve the previous release's code.
      - next-cache:/app/.next/cache
    ports:
      # Loopback only. TLS is the reverse proxy's job — exposing this directly
      # would serve the shop over plaintext HTTP.
      - "127.0.0.1:3000:3000"
    # Renders pages and optimises images, both of which spike under exactly the
    # traffic this shop is built to attract.
    mem_limit: 1500m
    mem_reservation: 384m

# ---------------------------------------------------------------------------
# MEMORY BUDGET — 8GB host
#
#   postgres  2.0G   api  1.5G   web  1.5G   =  5.0G capped
#   leaving   ~3.0G  for the host, Caddy, Docker itself, and the page cache
#
# WHY CAP AT ALL. Without a limit a container may grow until the HOST runs out,
# and the kernel then kills whichever process it judges worst — routinely
# Postgres, because it is the largest. The shop then loses its database over a
# burst of image traffic. With limits the offender is killed instead, `restart:
# unless-stopped` brings it back, and the database never notices.
#
# The headroom is not slack. Postgres reads through the kernel's page cache,
# which lives in that free memory and is what keeps the catalogue queries off
# the disk; filling it with container limits would trade crashes for slowness.
#
# WHY NO CPU LIMIT. Deliberate. Memory exhaustion kills; CPU contention only
# slows, and the kernel's scheduler shares cores better than a fixed quota can.
# Capping `web` would throttle image optimisation during precisely the traffic
# spike the cap was meant to survive.
#
# ON A DIFFERENT HOST: keep the same shape — Postgres largest, roughly a third
# of total memory left uncapped — and scale the three numbers together.
# ---------------------------------------------------------------------------

volumes:
  postgres-data:
  uploads:
  next-cache:
